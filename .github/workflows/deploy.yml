name: Deploy SQL Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Iniciar SQL Server en Docker
        run: |
          docker run -d --name sqlserver \
            -e ACCEPT_EULA=$ACCEPT_EULA \
            -e MSSQL_PID=$MSSQL_PID \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 \
            -v ${{ github.workspace }}/sql:/sql \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Esperar a que SQL Server esté listo
        run: |
          for i in {1..30}; do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server listo"; exit 0
            fi
            echo "Esperando... ($i)"; sleep 3
          done
          docker logs sqlserver
          exit 1

      - name: Ejecutar scripts SQL
        run: |
          for f in create_database create_tables create_procedure create_trigger test_data; do
            echo "==> Ejecutando $f.sql"
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /sql/$f.sql
          done
